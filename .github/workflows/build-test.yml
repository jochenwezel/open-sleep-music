name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5
      - name: Restore
        run: |
          dotnet restore src/OpenSleepMusic.App/OpenSleepMusic.App.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true
          dotnet restore src/OpenSleepMusic.Core/OpenSleepMusic.Core.csproj
      - name: Build desktop app
        run: dotnet build src/OpenSleepMusic.App/OpenSleepMusic.App.csproj --framework net10.0-windows10.0.19041.0 --configuration Release --no-restore -p:RuntimeIdentifier=win-x64 -p:SelfContained=true
      - name: Test
        run: dotnet test tests/OpenSleepMusic.Core.Tests/OpenSleepMusic.Core.Tests.csproj --configuration Release
