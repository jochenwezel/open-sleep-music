name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        preview: [false, true]
    env:
      OpenSleepMusicPreview: ${{ matrix.preview }}
      OpenSleepMusicReleaseDate: '2026-12-31'
    steps:
      - uses: actions/checkout@v5
      - name: Restore
        run: |
          dotnet restore src/OpenSleepMusic.App/OpenSleepMusic.App.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true
          dotnet restore src/OpenSleepMusic.Core/OpenSleepMusic.Core.csproj
      - name: Build desktop app
        run: dotnet build src/OpenSleepMusic.App/OpenSleepMusic.App.csproj --framework net10.0-windows10.0.19041.0 --configuration Release --no-restore -p:RuntimeIdentifier=win-x64 -p:SelfContained=true
      - name: Test
        run: dotnet test tests/OpenSleepMusic.Core.Tests/OpenSleepMusic.Core.Tests.csproj --configuration Release
      - name: Verify compiled audio storage migration cutoff
        shell: pwsh
        run: |
          ./tools/Test-AudioStorageBuild.ps1 -AssemblyPath src/OpenSleepMusic.App/bin/Release/net10.0-windows10.0.19041.0/win-x64/OpenSleepMusic.App.dll -ExpectLegacyMigration
          dotnet build src/OpenSleepMusic.App/OpenSleepMusic.App.csproj --framework net10.0-windows10.0.19041.0 --configuration Release --no-restore -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:OpenSleepMusicReleaseDate=2027-01-01
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/Test-AudioStorageBuild.ps1 -AssemblyPath src/OpenSleepMusic.App/bin/Release/net10.0-windows10.0.19041.0/win-x64/OpenSleepMusic.App.dll
