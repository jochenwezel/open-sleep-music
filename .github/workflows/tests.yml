name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        preview: [false, true]
    env:
      OpenSleepMusicPreview: ${{ matrix.preview }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Test catalog insertion policy
        shell: pwsh
        run: ./tools/Test-CatalogOrdering.ps1
      - name: Test core
        run: dotnet test tests/OpenSleepMusic.Core.Tests/OpenSleepMusic.Core.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-preview-${{ matrix.preview }}
          path: TestResults
          if-no-files-found: ignore
