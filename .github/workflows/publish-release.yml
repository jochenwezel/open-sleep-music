name: Publish release artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  OpenSleepMusicPreview: ${{ github.event.release.prerelease }}
  OpenSleepMusicReleaseDate: ${{ github.event.release.published_at }}

jobs:
  publish-windows:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Publish unpackaged Windows app
        run: dotnet publish src/OpenSleepMusic.App/OpenSleepMusic.App.csproj --framework net10.0-windows10.0.19041.0 --configuration Release -p:OpenSleepMusicPreview=${{ github.event.release.prerelease }} --self-contained false -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=false --output artifacts/windows
      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/windows/* -DestinationPath artifacts/open-sleep-music-windows-${{ github.event.release.tag_name }}.zip
      - name: Upload Windows artifact to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/open-sleep-music-windows-${{ github.event.release.tag_name }}.zip --clobber
