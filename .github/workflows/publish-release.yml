name: Publish release artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install Android workload
        run: dotnet workload install android maui --skip-manifest-update
      - name: Publish installable test APK
        run: dotnet publish src/OpenSleepMusic.App/OpenSleepMusic.App.csproj --framework net10.0-android --configuration Release -p:AndroidPackageFormats=apk -p:AndroidKeyStore=false
      - name: Prepare Android release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/android -Force | Out-Null
          $apk = Get-ChildItem src/OpenSleepMusic.App/bin/Release/net10.0-android/publish/*-Signed.apk | Select-Object -First 1
          if (-not $apk) { throw "No installable signed APK was produced." }
          Copy-Item $apk.FullName "artifacts/android/open-sleep-music-${{ github.event.release.tag_name }}-test.apk"
          (Get-FileHash "artifacts/android/open-sleep-music-${{ github.event.release.tag_name }}-test.apk" -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content "artifacts/android/open-sleep-music-${{ github.event.release.tag_name }}-test.apk.sha256"
      - name: Upload Android artifact to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/android/* --clobber

  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Publish unpackaged Windows app
        run: dotnet publish src/OpenSleepMusic.App/OpenSleepMusic.App.csproj --framework net10.0-windows10.0.19041.0 --configuration Release --runtime win-x64 --self-contained true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true --output artifacts/windows
      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/windows/* -DestinationPath artifacts/open-sleep-music-windows-${{ github.event.release.tag_name }}.zip
      - name: Upload Windows artifact to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/open-sleep-music-windows-${{ github.event.release.tag_name }}.zip --clobber
